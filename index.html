<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retirement Planner · Hybrid 4-Bucket (India NRI & Singapore)</title>
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body data-region="india">

<header class="app-header">
  <div class="wrap header-inner">
    <div class="brand">
      <div class="logo">◴</div>
      <div>
        <div class="brand-title">Retirement Planner</div>
        <div class="brand-sub">Hybrid 4-bucket framework</div>
      </div>
    </div>

    <div class="region-switch" role="tablist" aria-label="Residency">
      <button class="region-btn" data-region-btn="india"><span class="flag">🇮🇳</span> India (NRI)</button>
      <button class="region-btn" data-region-btn="singapore"><span class="flag">🇸🇬</span> Singapore</button>
    </div>

    <div class="header-actions">
      <button class="btn ghost sm" data-action="export">Export</button>
      <button class="btn ghost sm" data-action="reset">Reset</button>
    </div>
  </div>

  <nav class="tabs wrap" aria-label="Sections">
    <button class="tab-btn" data-tab-btn="inputs">1 · Inputs</button>
    <button class="tab-btn" data-tab-btn="budget">2 · Budget</button>
    <button class="tab-btn" data-tab-btn="projection">3 · Projection</button>
    <button class="tab-btn" data-tab-btn="plan">4 · Your Plan</button>
    <button class="tab-btn" data-tab-btn="glossary">5 · Glossary</button>
  </nav>
</header>

<div class="disclaimer wrap">
  <strong>Educational tool — not financial advice.</strong>
  Defaults are dated (<span id="asof"></span>) and editable. Verify current rates and consult a licensed adviser before acting.
</div>

<main class="wrap">
  <div id="print-title" class="print-only"></div>
  <div id="tab-content"></div>
</main>

<footer class="app-footer wrap">
  <p>Calculations run entirely in your browser; nothing is uploaded. Data is saved locally on this device only.</p>
</footer>

<!-- Scripts: load order matters (plain scripts, no bundler).
     The ?v= query busts browser caches — bump it whenever you change any asset. -->
<script src="js/constants.js?v=3"></script>
<script src="js/format.js?v=3"></script>
<script src="js/calc/corpus.js?v=3"></script>
<script src="js/calc/cpflife.js?v=3"></script>
<script src="js/calc/tax.js?v=3"></script>
<script src="js/calc/buckets.js?v=3"></script>
<script src="js/calc/drawdown.js?v=3"></script>
<script src="js/calc/risk.js?v=3"></script>
<script src="js/state.js?v=3"></script>
<script src="js/ui/helpers.js?v=3"></script>
<script src="js/ui/charts.js?v=3"></script>
<script src="js/ui/inputs.js?v=3"></script>
<script src="js/ui/budget.js?v=3"></script>
<script src="js/ui/projection.js?v=3"></script>
<script src="js/ui/plan.js?v=3"></script>
<script src="js/ui/glossary.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
